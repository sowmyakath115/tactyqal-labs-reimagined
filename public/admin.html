<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Blog admin | Tactyqal redesign</title><link rel="stylesheet" href="/styles.css"><script src="/admin.js" defer></script></head><body><header class="nav"><div class="wrap nav-inner"><a class="brand" href="/"><span class="brand-mark">t<span>✳</span></span> tactyqal<span class="brand-light">labs.</span></a><a class="text-link" href="/blog">View public blog ↗</a></div></header><main class="wrap"><div class="page-head"><span class="eyebrow">CONTENT MANAGEMENT</span><h1>Editorial studio.</h1><p>Create, edit and publish blog posts. Drafts stay private until published.</p></div><section class="panel login" id="login" hidden><h2>Admin sign in</h2><form id="login-form"><label class="field">Password<input id="password" type="password" required autocomplete="current-password"></label><button class="btn" type="submit">Sign in</button></form><p class="status" id="login-status" role="status"></p></section><p id="initial-status" role="status">Checking your session…</p><section id="dashboard" hidden><div class="admin-top"><h2>Manage your content</h2><button class="btn secondary small" id="logout">Sign out</button></div><div class="admin-layout"><div class="panel"><div class="admin-top"><h2>Posts</h2><button class="btn small" id="new-post">+ New post</button></div><form id="admin-filter" class="toolbar"><input id="filter-q" type="search" placeholder="Search posts" aria-label="Search posts"><select id="filter-status" aria-label="Filter by status"><option value="">All statuses</option><option value="draft">Draft</option><option value="published">Published</option></select><button class="btn secondary small" type="submit">Filter</button></form><div id="admin-list" class="admin-list" aria-live="polite"></div><div id="admin-pagination" class="pagination" hidden><button id="admin-prev" class="btn secondary small">Previous</button><span id="admin-page"></span><button id="admin-next" class="btn secondary small">Next</button></div></div><div class="panel"><h2 id="editor-title">New post</h2><form id="editor"><label class="field">Title<input id="title" required minlength="3" maxlength="140"></label><label class="field">Slug<input id="slug" required minlength="3" maxlength="120" pattern="[a-z0-9]+(-[a-z0-9]+)*" placeholder="my-new-post"></label><label class="field">Excerpt<textarea id="excerpt" rows="3" required minlength="10" maxlength="300"></textarea></label><label class="field">Category<select id="editor-category" required></select></label><label class="field">Article body (plain text)<textarea id="body" rows="9" required minlength="20" maxlength="50000"></textarea></label><label class="field">Status<select id="editor-status"><option value="draft">Draft</option><option value="published">Published</option></select></label><div class="actions"><button class="btn" type="submit">Save post</button><button type="button" class="btn danger" id="delete" hidden>Delete post</button></div></form><p id="editor-message" class="status" role="status"></p></div></div></section></main><footer class="wrap footer"><span>Independent hire-a-thon CMS demo</span><a href="/">Homepage</a></footer></body></html>
